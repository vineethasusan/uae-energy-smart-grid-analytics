[project]
name = "uae-energy-smart-grid-analytics"
version = "1.0.0"
description = "Day-ahead load and rooftop solar forecasting and meter-tampering detection for a UAE distribution network"
authors = [{ name = "Vineetha Susan Alexander" }]
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
# essential checks: syntax errors and undefined names
select = ["E9", "F63", "F7", "F82"]
